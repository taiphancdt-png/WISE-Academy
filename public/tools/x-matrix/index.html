document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: colum :flex;flex-direction:column;gap:10px\">\n              <sc-for list=\"{{ t1.children }}\" as=\"t2\" hint-placeholder-count=\"2\">\n                <div>\n                  <div sc-camel-on-click=\"{{ t2.onClick }}\" style=\"cursor:pointer;display:flex;gap:8px;align-items:baseline;font-size:13px;flex-wrap:wrap\" style-hover=\"color:#F26522\">\n                    <span style=\"color:#F26522\">{{ t2.strength }}<\u002Fspan>\n                    <span style=\"font-size:11px;font-weight:700;color:var(--color-neutral-600)\">Cấp 2 · {{ t2.guide }}<\u002Fspan>\n                    <span style=\"font-weight:600\">{{ t2.name }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"margin:6px 0 0 18px;display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ t2.children }}\" as=\"t3\" hint-placeholder-count=\"2\">\n                      <span sc-camel-on-click=\"{{ t3.onClick }}\" style=\"cursor:pointer;background:var(--color-neutral-100);border-radius:999px;padding:3px 10px;font-size:11px\" style-hover=\"background:#FFF1E8\">{{ t3.strength }} Cấp 3 · {{ t3.guide }} · {{ t3.name }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"margin-top:24px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(6,46,95,0.06);padding:28px\">\n      <h2 style=\"font-size:22px;font-weight:800;margin:0 0 4px;color:#062E5F\">Cần chú ý · Needs Attention<\u002Fh2>\n      <p style=\"font-size:12px;opacity:0.6;margin:0 0 var(--space-3)\">KPI trễ hoặc có nguy cơ trễ tiến độ, gộp từ cả 3 cấp<\u002Fp>\n      <sc-if value=\"{{ hasAttentionItems }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"overflow-x:auto;border:1px solid var(--color-divider);border-radius:14px\">\n          <sc-raw-table class=\"table\" style=\"widt -3);border-top:1px solid var(--color-divider)\"><span class=\"tag\" style=\"background:{{ it.color }};color:white;font-size:10px\">{{ it.statusLabel }}<\u002Fspan><\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !hasAttentionItems }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size:12px;opacity:0.55\">Không có KPI nào trễ hoặc có nguy cơ trễ. · No KPIs at risk.<\u002Fp>\n      <\u002Fsc-if>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ !isDashboardView }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-3)\">\n      <div>\n        <div style=\"font-size:12px;font-weight:700;letter-spacing:0.2em;color:var(--color-accent);margin-bottom:6px\">POLICY DEPLOYMENT · {{ companyName }} · 2026<\u002Fdiv>\n        <h1 style=\"margin:0;font-size:32px;font-weight:800;color:#062E5F;letter-spacing:-0.01em;line-height:1.2\">{{ levelViVn }} · {{ levelEn }}<\u002Fh1>\n        <p style=\"margin:4px 0 0;opacity:0.6;font-size:13px\">{{ companyName }} · Năm/Year 2026 · Phụ trách/Owner: {{ levelOwner }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:var(--space-2)\">\n        <button type=\"button\" class=\"btn btn-primary\" sc-camel-on-click=\"{{ onToggleEdit }}\" style=\"border-radius:999px;background:#062E5F;border-color:#062E5F;color:#fff;padding:10px 24px;font-weight:700\">{{ editToggleLabel }}<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ onPrint }}\" style=\"border-radius:999px;background:#F26522;border:none;color:#fff;padding:10px 22px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit\" style-hover=\"background:#DB5414\">Tải PDF · PDF<\u002Fbutton>\n        <button type=\"button\" class=\"btn btn e=\"{{ kpi.onUnit }}\" sc-camel-on-blur=\"{{ kpi.onCommit }}\" style=\"width:100%;box-sizing:border-box;border:1px dashed #A9B4C4;border-radius:4px;background:#fff;font-family:inherit;padding:2px 6px;color:#062E5F;font-size:11px\">\n                        <div style=\"grid-column:1 / span 2;font-size:11px;font-weight:700;color:#B6430E\">Mã: {{ kpi.guide }}<\u002Fdiv>\n                        <div style=\"grid-column:1 / span 2;display:flex;gap:4px\">\n                          <button type=\"button\" sc-camel-on-click=\"{{ kpi.onDirUp }}\" style=\"flex:1;border:1px solid;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;{{ kpi.dirUpStyle }}\">↑ Cao hơn là tốt<\u002Fbutton>\n                          <button type=\"button\" sc-camel-on-click=\"{{ kpi.onDirDown }}\" style=\"flex:1;border:1px solid;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;{{ kpi.dirDownStyle }}\">↓ Thấp hơn là tốt<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <button type=\"button\" title=\"Xoá KPI\" sc-camel-on-click=\"{{ kpi.onRemove }}\" style=\"border:none;background:#F26522;color:#fff;border-radius:50%;width:18px;height:18px;font-size:12px;line-height:18px;padding:0;cursor:pointer;flex-shrink:0;font-family:inherit\">×<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fsc-raw-td>\n                <sc-for list=\"{{ kpi.months }}\" as=\"m\" hint-placeholder-count=\"12\">\n                  <sc-raw-td style=\"text-align:center;padding:var(--space-1);border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)\">\n                    <div style=\"display:flex;flex-direction:column;align-items:center;gap:2px\">\n                      <input type=\"text\" value=\"{{ m.targetDisplay }}\" placeholder=\"–\" sc-camel-read-only=\"{{ !editMode }}\" sc-camel-on-change=\"{{ noop }}\" sc-camel-on-blur=\"{{ m.onTargetBlur }}\" style=\"width:42px;text-align:center;border:none;background:transparent;font-family:inherit;padding:0;font-size:10px;opacity:0.6;color:inherit\">\n                      <input type=\"text\" value=\"{{ m.actualDisplay }}\" placeholder=\"–\" sc-camel-read-only=\"{{ !editMode }}\" sc-camel-on-change=\"{{ noop }}\" sc-camel-on-blur=\"{{ m.onActualBlur }}\" style=\"width:42px;text-align:center;border:none;background:transparent;font-family:inherit;padding:0;font-size:13px;font-weight:600;color:{{ m.actualColor }}\" style-focus=\"outline:2px solid var(--color-accent);outline-offset:1px\">\n                    <\u002Fdiv>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-for>\n                <sc-raw-td style=\"padding:var(--space-1);border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)\">\n                  <sc-if value=\"{{ kpi.hasTrend }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg sc-camel-view-box=\"0 0 128 32\" width=\"128\" height=\"32\">\n                      <polyline points=\"{{ kpi.targetPoints }}\" style=\"fill:none;stroke:var(--color-neutral-400);stroke-width:1.5;stroke-dasharray:3 2\"><\u002Fpolyline>\n                      <polyline points=\"{{ kpi.actualPoints }}\" style=\"fill:none;stroke:var(--color-accent-700);stroke-width:2\"><\u002Fpolyline>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ editMode }}\" hint-placeholder-val=\"{{ false }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ onAddKpi }}\" style=\"margin-top:12px;border:1.5px solid #F26522;background:#fff;color:#F26522;border-radius:999px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit\" style-hover=\"background:#F26522;color:#fff\">+ Thêm chỉ số ④ · Add KPI<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showBowlerEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"font-size:13px;color:var(--color-neutral-600);margin:12px 0 0\">Chưa có KPI. Bấm \"Chỉnh sửa\" rồi \"+ Thêm KPI\", hoặc tải ví dụ.<\u002Fp>\n      <\u002Fsc-if>\n      <p style=\"font-size:12px;opacity:0.55;margin-top:var(--space-3);max-width:70ch\">Ô trên mỗi tháng: Target (nhạt) · Ô dưới: Actual (đậm, có màu theo tiến độ) — cả hai đều chỉnh sửa được, bấm ra ngoài ô để lưu. Dữ liệu lưu tạm trong trình duyệt này. / Top cell: Target · Bottom cell: Actual, colored by status — both editable, click away to save. Data persists in this browser only.<\u002Fp>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;matrixView&quot;: {&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Sơ đồ X đầy đủ · Diamond&quot;,&quot;options&quot;:[&quot;Sơ đồ X đầy đủ · Diamond&quot;,&quot;Rút gọn · List&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;X-Matrix&quot;,&quot;label&quot;:&quot;Kiểu hiển thị X-Matrix&quot;},\n  &quot;showMetricsAxis&quot;: {&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;X-Matrix&quot;,&quot;label&quot;:&quot;Hiện trục Mục tiêu cải tiến (Target to Improve)&quot;},\n  &quot;accentColor&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F26522&quot;,&quot;options&quot;:[&quot;#F26522&quot;,&quot;#062E5F&quot;,&quot;#0f766e&quot;,&quot;#7c3aed&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Style&quot;,&quot;label&quot;:&quot;Màu nhấn&quot;}\n}\">\n\nconst MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\nconst LEVEL_LABELS = [['Cấp 1','Top Level'],['Cấp 2','Second Level'],['Cấp 3','Third Level']];\nconst STORE_KEY = 'pdp-hg-bowler-v1';\nconst MX_KEY = 'pdp-hg-matrix-v1';\n\n// Smooth line through the points (monotone cubic): curves gently but never swings above or below the data,\n// so a month at 0% or 100% stays inside the chart.\n// Links between objectives, priorities and KPIs are simply marked (✕) or not; only the owners area (Đông xa)\n// tells primary (●) from secondary (○). Older plans saved ●/○ there too: they count as links, ● first.\nconst LINK_RANK = { l: 0, x: 1, m: 2 };\nconst WISE_NAVY = '#002F5B';\nconst linkIdx = (marks) => {\n  let best = -1;\n  marks.forEach((v, i) => { if (v && LINK_RANK[v] != null && (best < 0 || LINK_RANK[v] < LINK_RANK[marks[best]])) best = i; });\n  return best;\n};\n\nconst smoothPath = (p) => {\n  if (!p.length) return '';\n  if (p.length < 3) return 'M' + p.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' L');\n  const n = p.length, d = [], t = [];\n  for (let i = 0; i < n - 1; i++) d.push((p[i + 1][1] - p[i][1]) / (p[i + 1][0] - p[i][0]));\n  t[0] = d[0]; t[n - 1] = d[n - 2];\n  for (let i = 1; i < n - 1; i++) t[i] = d[i - 1] * d[i] <= 0 ? 0 : (2 * d[i - 1] * d[i]) / (d[i - 1] + d[i]);\n  let s = 'M' + p[0][0].toFixed(1) + ',' + p[0][1].toFixed(1);\n  for (let i = 0; i < n - 1; i++) {\n    const h = (p[i + 1][0] - p[i][0]) / 3;\n    s += ' C' + (p[i][0] + h).toFixed(1) + ',' + (p[i][1] + t[i] * h).toFixed(1) + ' ' + (p[i + 1][0] - h).toFixed(1) + ',' + (p[i + 1][1] - t[i + 1] * h).toFixed(1) + ' ' + p[i + 1][0].toFixed(1) + ',' + p[i + 1][1].toFixed(1);\n  }\n  return s;\n};\n\nconst loadScript = (src, ready) => ready() ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });\n\nclass Component extends DCLogic {\n  state = { loaded: false, levelIdx: 0, deptFilter: {}, matrixDeptFilter: {}, data: null, matrix: null, selectedRow: {}, pillarDescOverrides: {}, company: '', view: 'dashboard', editMode: false };\n\n  emptyLevels() {\n    return [['top','Cấp 1','Top Level'],['second','Cấp 2','Second Level'],['third','Cấp 3','Third Level']].map(([key, vi, en]) => ({ key, vi, en, owner: '', kpis: [] }));\n  }\n  emptyMatrix() {\n    const e = () => ({ owner: '', revDate: '', priorities: [], pillars: [], metrics: [], resources: [], parent: { type: 'marks', items: [] } });\n    return { top: e(), second: e(), third: e() };\n  }\n  async componentDidMount() {\n    const exMod = await import((window.__resources && window.__resources.exData) || './example-hoanggia.js');\n    this.example = exMod.EXAMPLE;\n    this.baseData = this.emptyLevels();\n    this.baseMatrix = this.emptyMatrix();\n    let data = null, matrix = null, company = '';\n    try {\n      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');\n      if (saved && Array.isArray(saved.levels) && saved.levels.length === 3) { data = saved.levels; company = saved.company || ''; }\n    } catch (e) {}\n    try { matrix = JSON.parse(localStorage.getItem(MX_KEY) || 'null'); } catch (e) {}\n    if (!data) data = this.emptyLevels();\n    if (!matrix || !matrix.top) matrix = this.emptyMatrix();\n    if ((matrix.exVersion || company === this.example.company) && matrix.exVersion !== this.example.version) {\n      const ex = JSON.parse(JSON.stringify(this.example));\n      matrix = { ...ex.matrix, exVersion: ex.version }; data = ex.levels; company = ex.company;\n      setTimeout(() => { this.persist(); this.persistMx(); }, 0);\n    }\n    this.setState({ data, matrix, company, loaded: true });\n  }\n\n  // Saves the page in view (dashboard or a level) straight to an A4 landscape PDF, no print dialog.\n  // Buttons are hidden (their space kept, so the layout matches the measured page breaks); every page ends with a WISE Academy footer (logo, credit line, page number).\n  // Long pages run over several A4 pages, cut between blocks rather than through them.\n  // html2canvas-pro is used because this page's styles use modern colour functions (color(), color-mix()).\n  async exportPDF() {\n    const el = document.querySelector('main');\n    if (!el) return;\n    const foot = document.createElement('div');\n    foot.style.cssText = 'padding:10px 4px 0;border-top:1px solid #D5DCE6;display:flex;align-items:center;gap:14px;background:#F5F7FA';\n    foot.innerHTML = '<img alt=\"\" src=\"/images/brand/logo-transparent.png\" style=\"height:32px;width:auto;display:block\" onerror=\"this.outerHTML=\\'<strong style=&quot;font-size:16px;color:#062E5F&quot;><span style=&quot;color:#F26522&quot;>WISE</span> Academy</strong>\\'\">' +\n      '<span style=\"font-size:13px;color:#486581\">Tạo bằng công cụ Policy Deployment · X-Matrix miễn phí của <strong style=\"color:#062E5F\">WISE Academy</strong></span>';\n    try {\n      await loadScript('https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js', () => !!window.html2canvas);\n      await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', () => !!(window.jspdf && window.jspdf.jsPDF));\n      el.appendChild(foot);\n      await new Promise((r) => { const img = foot.querySelector('img'); if (!img || img.complete) r(); else { img.onload = r; img.onerror = r; } });\n      const scale = 2;\n      const fc = await window.html2canvas(foot, { scale, backgroundColor: '#F5F7FA', windowWidth: 1320 });\n      foot.remove();\n      // The copy is laid out at a fixed desktop width whatever the size of the frame, so every PDF looks the same;\n      // block positions for the page breaks are measured on that copy.\n      let total = 0, boxes = [];\n      const c = await window.html2canvas(el, { scale, backgroundColor: '#F5F7FA', windowWidth: 1320, windowHeight: 900, onclone: (doc) => {\n        doc.querySelectorAll('main button, main [data-noprint=\"1\"]').forEach((b) => { b.style.visibility = 'hidden'; });\n        const cm = doc.querySelector('main');\n        // tables that scroll sideways on screen are shrunk to fit, so no month column is lost\n        [...cm.querySelectorAll('*')].filter((x) => x.scrollWidth > x.clientWidth + 2 && x.firstElementChild && getComputedStyle(x).overflowX !== 'visible').forEach((x) => {\n          const inner = x.firstElementChild, k = x.clientWidth / inner.scrollWidth;\n          if (k >= 1) return;\n          inner.style.transformOrigin = '0 0'; inner.style.transform = 'scale(' + k + ')';\n          x.style.overflow = 'visible'; x.style.height = (inner.offsetHeight * k) + 'px';\n        });\n        // html2canvas cannot draw vertical writing (the X-Matrix column labels): the same text is laid out\n        // horizontally in a box of the same size and turned a quarter turn, which looks identical\n        const gcs = (x) => doc.defaultView.getComputedStyle(x);\n        [...cm.querySelectorAll('*')].filter((x) => gcs(x).writingMode.startsWith('vertical') && !gcs(x.parentElement).writingMode.startsWith('vertical'))\n          .map((x) => [x, x.offsetWidth, x.offsetHeight]).forEach(([x, w, h]) => {\n            const inner = doc.createElement('div');\n            inner.innerHTML = x.innerHTML;\n            inner.style.cssText = 'position:absolute;left:0;top:0;width:' + h + 'px;height:' + w + 'px;display:flex;align-items:center;justify-content:center;transform-origin:0 0;transform:translate(' + w + 'px,0) rotate(90deg)';\n            x.innerHTML = '';\n            x.style.writingMode = 'horizontal-tb'; x.style.position = 'relative'; x.style.width = w + 'px'; x.style.height = h + 'px'; x.style.flex = 'none';\n            x.appendChild(inner);\n          });\n        const top0 = cm.getBoundingClientRect().top;\n        total = cm.scrollHeight;\n        boxes = [...cm.querySelectorAll('*')].map((n) => n.getBoundingClientRect()).filter((b) => b.height > 0)\n          .map((b) => ({ t: b.top - top0, b: b.bottom - top0 }));\n      } });\n      const pdf = new window.jspdf.jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });\n      pdf.setProperties({ title: 'Policy Deployment X-Matrix - ' + (this.state.company || 'WISE Academy'), creator: 'WISE Academy' });\n      const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), m = 8;\n      const r = (pw - 2 * m) / (c.width / scale); // mm per css px\n      const fh = (pw - 2 * m) * fc.height / fc.width; // footer height in mm, drawn at full content width\n      const pageH = (ph - 2 * m - fh - 3) / r; // css px that fit on one page above the footer\n      // a page may end at the edge of any block, as long as it does not cut through a card, row or chart\n      // (anything shorter than a page); only blocks taller than a page may be split\n      // blocks up to 1.6 pages tall (the X-Matrix) are kept whole and shrunk onto one page\n      const units = boxes.filter((x) => x.b - x.t < pageH * 1.6);\n      const edges = [...new Set(boxes.flatMap((x) => [Math.round(x.t), Math.round(x.b)]))].sort((a, b) => a - b);\n      // nor just below the top of a larger block, which would leave its heading alone at the foot of a page\n      const clean = (y) => !units.some((u) => u.t < y - 1 && u.b > y + 1) && !boxes.some((x) => x.t < y - 1 && y - x.t < 160 && x.b > y + 1);\n      const slices = [];\n      let y = 0;\n      // stop when only the page's bottom padding is left\n      while (boxes.some((x) => x.b > y + 2)) {\n        const fit = edges.filter((b) => b > y + pageH * 0.35 && b <= y + pageH && clean(b));\n        const over = edges.filter((b) => b > y + pageH && b <= y + pageH * 1.6 && clean(b));\n        const end = total - y <= pageH ? total : fit.length ? Math.max(...fit) : over.length ? Math.min(...over) : y + pageH;\n        slices.push([y, end]);\n        y = end;\n      }\n      const footImg = fc.toDataURL('image/png');\n      slices.forEach(([y, end], i) => {\n        const slice = document.createElement('canvas');\n        slice.width = c.width; slice.height = Math.round((end - y) * scale);\n        const ctx = slice.getContext('2d');\n        ctx.fillStyle = '#F5F7FA'; ctx.fillRect(0, 0, slice.width, slice.height);\n        ctx.drawImage(c, 0, Math.round(y * scale), c.width, slice.height, 0, 0, c.width, slice.height);\n        if (i) pdf.addPage();\n        pdf.setFillColor(245, 247, 250); pdf.rect(0, 0, pw, ph, 'F');\n        const k = Math.min(1, pageH / (end - y)); // below 1 only for a block taller than a page\n        const sw = (pw - 2 * m) * k;\n        pdf.addImage(slice.toDataURL('image/jpeg', 0.92), 'JPEG', m + (pw - 2 * m - sw) / 2, m, sw, (end - y) * r * k);\n        pdf.addImage(footImg, 'PNG', m, ph - m - fh, pw - 2 * m, fh);\n        pdf.setFontSize(8); pdf.setTextColor(122, 135, 154);\n        pdf.text((i + 1) + ' / ' + slices.length, pw - m, ph - m - fh / 2 + 1, { align: 'right' });\n      });\n      const view = this.state.view === 'dashboard' ? 'Dashboard' : 'Cap-' + (this.state.levelIdx + 1);\n      pdf.save(`X-Matrix-${(this.state.company || 'WISE').replace(/\\s+/g, '-')}-${view}.pdf`);\n    } catch (e) {\n      console.error('PDF export failed', e);\n      window.print(); // libraries could not load (offline): fall back to the print dialog\n    } finally {\n      foot.remove();\n    }\n  }\n\n  loadExample() {\n    const hasData = this.state.data.some(l => l.kpis.length) || ['top','second','third'].some(k => this.state.matrix[k].priorities.length);\n    if (hasData && !window.confirm('Thay toàn bộ dữ liệu hiện tại bằng ví dụ Công ty May Hoàng Gia?\\nReplace current data with the example?')) return;\n    const ex = JSON.parse(JSON.stringify(this.example));\n    this.setState({ data: ex.levels, matrix: { ...ex.matrix, exVersion: ex.version }, company: ex.company, selectedRow: {}, deptFilter: {}, matrixDeptFilter: {}, view: 'dashboard' }, () => { this.persist(); this.persistMx(); });\n  }\n  createNew() {\n    const hasData = this.state.data.some(l => l.kpis.length) || ['top','second','third'].some(k => th
